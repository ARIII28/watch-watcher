name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver-manager

      # Install Proxychains and Tor
      - name: Install Proxychains and Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y proxychains tor
          sudo service tor start

      # Run the script using Proxychains
      - name: Run Price Tracker with Proxychains
        run: |
          proxychains python main.py

      # Commit and Push Changes
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add myntra.csv
          git commit -m "Update price data"
          git push
