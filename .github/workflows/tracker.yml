name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver-manager

      # Install Chrome and ChromeDriver
      - name: Install Google Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y google-chrome-stable || echo "Chrome is already installed"
          wget -q https://chromedriver.storage.googleapis.com/$(google-chrome --version | sed -n 's/.* \([0-9]*\)\..*/\1/p')/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip -d /usr/local/bin/
          rm chromedriver_linux64.zip

      # Install Proxychains and Tor
      - name: Install Proxychains and Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y proxychains tor
          sudo service tor start

      # Run the price tracker script with Proxychains
      - name: Run Price Tracker with Proxychains
        env:
          DISPLAY: ":99"  # For headless browser operations
        run: |
          proxychains python main.py

      # Commit and Push Changes
      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add myntra.csv
          git commit -m "Update price data" || echo "No changes to commit"
          git push
