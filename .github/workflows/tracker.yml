name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver_manager

      # Install Google Chrome and ChromeDriver
      - name: Install Google Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Install Google Chrome
          CHROME_URL="https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.69/linux64/chrome-linux64.zip"
          wget -q $CHROME_URL -O chrome-linux64.zip
          sudo unzip -o chrome-linux64.zip -d /usr/local/
          rm chrome-linux64.zip
          
          # Install ChromeDriver
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.69/linux64/chromedriver-linux64.zip"
          wget -q $CHROMEDRIVER_URL
          sudo unzip -o chromedriver-linux64.zip -d /usr/local/bin/
          rm chromedriver-linux64.zip

      # Run the script
      - name: Run Price Tracker
        run: |
          python main.py

      # Commit and Push Changes
      - name: Commit and Push Changes
        run: |
          git config --global user.name "ARIII28"
          git config --global user.email "aribalan24@gmail.com.com"
          git add myntra.csv
          git commit -m "Update price data"
          git push
 
        