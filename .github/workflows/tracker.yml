name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours at midnight (UTC)

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver-manager

      # Install Google Chrome
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb
          sudo apt-get -f install -y

      # Verify Google Chrome Installation
      - name: Verify Chrome Installation
        run: google-chrome --version

      # Install ChromeDriver
      - name: Install ChromeDriver
        run: |
          LATEST=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE)
          wget https://chromedriver.storage.googleapis.com/$LATEST/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      # Verify ChromeDriver Installation
      - name: Verify ChromeDriver Installation
        run: chromedriver --version

      # Set up virtual display for Selenium
      - name: Set up virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x16 &
        env:
          DISPLAY: :99

      # Run the Python script
      - name: Run Price Tracker
        run: python main.py

      # Commit and push changes if the CSV is modified
      - name: Commit and Push Changes if modified
        run: |
          git diff --quiet myntra.csv || git add myntra.csv && git commit -m "Update price data" && git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
