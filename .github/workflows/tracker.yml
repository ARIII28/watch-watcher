name: Price Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours (midnight)

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent

      # Install ChromeDriver
      - name: Set up ChromeDriver
        uses: actions/setup-chromedriver@v2
        with:
          chrome-version: 'latest'  # Ensures compatibility with the browser version

      # Run the script
      - name: Run Price Tracker
        run: python main.py
