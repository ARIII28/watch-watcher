name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours at midnight (UTC)

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver-manager

      # Install Google Chrome
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb
          sudo apt-get -f install

      # Install Chrome dependencies
      - name: Install Chrome dependencies
        run: |
          sudo apt-get install -y \
            libxss1 \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libgdk-pixbuf2.0-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxtst6

      # Install ChromeDriver
      - name: Install ChromeDriver
        run: |
          # Get the latest version of ChromeDriver
          LATEST=$(wget -qO- https://chromedriver.storage.googleapis.com/LATEST_RELEASE)
          wget https://chromedriver.storage.googleapis.com/$LATEST/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      # Run the script with logging enabled
      - name: Run Price Tracker with Logging
        run: |
          python -m pip install selenium
          python main.py
        env:
          DISPLAY: :99.0  # Necessary for running headless Chrome on GitHub Actions runner

      # Commit and Push Changes if modified
      - name: Commit and Push Changes if modified
        run: |
          git diff --quiet myntra.csv || git commit -am "Update price data" && git push
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
