name: watch-watcher

on:
  push:
    branches:
      - main
  workflow_dispatch: 
  schedule:
    - cron: "0 0 * * *" 

jobs:
  price_tracking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium fake-useragent webdriver-manager

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb
          sudo apt-get -f install

      - name: Install ChromeDriver
        run: |
          LATEST=$(wget -qO- https://chromedriver.storage.googleapis.com/LATEST_RELEASE)
          wget https://chromedriver.storage.googleapis.com/$LATEST/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Run Price Tracker
        run: |
          python main.py
        env:
          DISPLAY: ":99"

      - name: Commit and Push Changes if modified
        run: |
          git diff --quiet myntra.csv || git commit -am "Update price data" && git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
