name: Price Tracker Workflow

on:
  push:  # Trigger the workflow on push
    branches:
      - main  # Replace 'main' with your branch name if different

  schedule:  # Trigger the workflow every 24 hours
    - cron: '0 0 * * *'  # This runs at 12:00 AM UTC every day (adjust as needed)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run the Python script
        run: python main.py
        
      - name: Commit CSV and log updates
        run: |
          git add .
          git commit -m "Update CSV and log files from workflow" || echo "No changes to commit"

      # Step 9: Push changes back to the repository
      - name: Push changes
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
