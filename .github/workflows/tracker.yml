name: Price Tracker Workflow

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  track-price:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install Chrome
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Step 4: Install Python dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 5: Run the Python script
      - name: Run Price Tracker Script
        run: python main.py

      # Step 6: Configure Git to commit changes
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 7: Commit changes to the repository
      - name: Commit CSV and log updates
        run: |
          git add .
          git commit -m "Update CSV and log files from workflow" || echo "No changes to commit"

      # Step 8: Push changes back to the repository
      - name: Push changes
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
