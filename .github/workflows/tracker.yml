name: Price Tracker Workflow

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  schedule:
    - cron: '0 0 * * *'  # Run daily at 12:00 AM UTC

jobs:
  run-script:
    runs-on: windows-latest  # Use Windows runner for compatibility

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Ensure Python 3.10 is used

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Python price tracker
      - name: Run the Python price tracker
        run: python main.py

      # Step 5: Commit and push updates to CSV/log
      - name: Commit and push changes
        run: |
         git config --global user.name "${{ secrets.GIT_USER }}"
         git config --global user.email "${{ secrets.GIT_EMAIL }}"
         git pull --rebase origin main  # Pull the latest changes
         git add myntra.csv price_tracker.log
         git commit -m "Update CSV and log files" || echo "No changes to commit"
         git push
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
